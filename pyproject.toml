[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "echo-ai"
version = "0.1.0"
description = "A small local coding agent with Docker tools"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28,<1",
    "prompt-toolkit>=3.0.51,<4",
    "rich>=14,<15",
    "jsonschema>=4.23,<5",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
]

[project.scripts]
echo-ai = "echo_ai.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "pexpect>=4.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_ai"]
