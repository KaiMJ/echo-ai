# Use: uv run python scripts/deploy_local_model.py qwen up
# Model command and cache mount are supplied from packaged model templates.
name: echo
services:
  inference:
    image: vllm/vllm-openai@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1
    container_name: echo-vllm
    gpus: all
    shm_size: 4gb
    ports:
    - 127.0.0.1:${ECHO_INFERENCE_PORT:-8001}:8000
    environment:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - inference-cache:/root/.cache/vllm
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 60s
    profiles:
    - managed
volumes:
  inference-cache: null
