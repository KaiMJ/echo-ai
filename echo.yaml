# Runtime defaults for new sessions. ECHO_* environment variables override them.
local-model:
  # base_url defaults to localhost using ECHO_INFERENCE_PORT (8001 by default).
  model: cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
  reasoning_enabled: true
  return_reasoning: false # Send saved reasoning traces back to the model.
  context_tokens: 262144
  max_tokens: 16384
  max_context_chars: null
  timeout: 180
  temperature: 1.0
  top_p: 0.95
  top_k: 64

agent:
  max_steps: 20
  child_max_steps: 8

sandbox:
  # Sizes are bytes; timeouts are seconds.
  max_workspace_bytes: 536870912 # 512 MiB
  # Docker resource limits.
  sandbox_pids: 128
  sandbox_memory_bytes: 1073741824
  sandbox_cpus: 2.0
  sandbox_file_bytes: 67108864
  sandbox_tmp_bytes: 134217728

# Tool defaults apply to every sandbox tool, including list.
tools:
  defaults:
    max_output_bytes: 32768
    timeout: 60
  read:
    default_lines: 200
    max_lines: 500
  search:
    max_matches_per_file: 50
  write:
    max_bytes: 1048576
  edit:
    max_bytes: 1048576 # Maximum resulting file size.
  bash:
    max_timeout: 120

# Interface colors. Quote hex values so YAML does not treat them as comments.
# Applied on launch, including resumed sessions. Conversation rows stay unshaded.
theme:
  foreground: "#eeeeee"
  accent: "#5fd7df"
  muted: "#999999"
  error: "#ff5f5f"
  warning: "#e5c07b"
  success: "#98c379"
  spinner: "#c678dd"
  input_background: "#262626"
  input_border: "#555555"
  selection_background: "#555555"
  selection_foreground: "#ffffff"
