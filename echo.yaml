# Shared settings. ECHO_* environment variables override YAML.
model-profile: models/qwen.yaml

agent:
  max_steps: 64
  child_max_steps: 24

sandbox:
  # Sizes are bytes; timeouts are seconds.
  max_workspace_bytes: 536870912 # 512 MiB
  # Docker resource limits.
  sandbox_pids: 128
  sandbox_memory_bytes: 1073741824
  sandbox_cpus: 2.0
  sandbox_file_bytes: 67108864
  sandbox_tmp_bytes: 134217728

# Tool defaults apply to every sandbox tool, including list.
tools:
  defaults:
    max_output_bytes: 32768
    timeout: 60
  read:
    default_lines: 200
    max_lines: 500
  search:
    max_matches_per_file: 50
  write:
    max_bytes: 1048576
  edit:
    max_bytes: 1048576 # Maximum resulting file size.
  bash:
    max_timeout: 120

# Interface appearance. Choose dark, light, or terminal (inherit terminal colors).
# Applied on launch, including resumed sessions. Individual colors can override a preset.
theme:
  preset: dark
