# xAI Chat Completions via LiteLLM; credentials are loaded only at runtime.
provider: xai
model: grok-4.3
base_url: https://api.x.ai/v1
api_key_env: XAI_API_KEY
request_format: standard
context_tokens: 1000000
max_tokens: 16384
timeout: 600
temperature: 1.0
top_p: 0.95
reasoning_enabled: true
# Grok 4.3 supports none, low, medium, and high.
reasoning_effort: low
return_reasoning: false
